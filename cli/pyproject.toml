[project]
name = "gherkai"
# version 与依赖均动态：`gherkai-runtime[aws]=={{ version }}` 由 metadata hook 在 build 时渲染（ADR 0037 决策 2b）。
dynamic = ["version", "dependencies"]
description = "gherkai CLI：执行核心库的最薄前端 = 组合根——读 .feature、new 出具体 Engine adapter 注入给 core、渲染 RunResult（ADR 0016）。发行名 gherkai / import 名 gherkai_cli / 命令 gherkai（ADR 0037）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhi Yan Liu" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
# 安装后 `gherkai <子命令>`；开发期 `uv run gherkai …`（workspace 根）
gherkai = "gherkai_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/zhiyanliu/gherkai"
Repository = "https://github.com/zhiyanliu/gherkai"
Changelog = "https://github.com/zhiyanliu/gherkai/releases"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
# 依赖产品本体 gherkai-runtime（它再依赖 core 窄腰）；引擎不在此声明——引擎是被 spawn 的子进程，
# 装配 cmd 的知识在 runtime（ADR 0016「演进」节/0026）。
# 硬依赖 `[aws]`：裸装 `gherkai` 即可 `--backend cloud`（ADR 0037 决策 2c 反转了「cli 主依赖不含 boto3」）；
# local 路径仍绝不 import boto3（懒加载在 compose 的 _make_* 钩子里），与安装期是否装了 boto3 无关。
dependencies = [
    "gherkai-runtime[aws]=={{ version }}",
]

[tool.uv.sources]
gherkai-runtime = { workspace = true }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# 版本唯一真源 = git tag vX.Y.Z（ADR 0037 决策 2b）。四项显式钉死、不靠默认值：
# style=pep440（镜像 tag 归一化与 skew 比较都建立在 PEP 440 形态上）；strict=true（无 tag 即 build 失败，
# 不静默回落 0.0.0）；dirty=true + metadata=true（任何非纯净发行状态都带 + 本地段——默认下 tag commit 上带
# 未提交改动构建出的版本与正式发行版逐字节相同，skew 的「非纯净版本跳过」就不会触发）。
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
strict = true
dirty = true
metadata = true

[tool.hatch.build.targets.wheel]
packages = ["gherkai_cli"]
