[project]
name = "gherkai"
version = "0.1.0"
description = "gherkai CLI：执行核心库的最薄前端 = 组合根——读 .feature、new 出具体 Engine adapter 注入给 core、渲染 RunResult（ADR 0016）。发行名 gherkai / import 名 gherkai_cli / 命令 gherkai（ADR 0037）"
readme = "README.md"
requires-python = ">=3.13"
# 依赖产品本体 gherkai-runtime（它再依赖 core 窄腰）；引擎不在此声明——引擎是被 spawn 的子进程，
# 装配 cmd 的知识在 runtime（ADR 0016「演进」节/0026）。
# 硬依赖 `[aws]`：裸装 `gherkai` 即可 `--backend cloud`（ADR 0037 决策 2c 反转了「cli 主依赖不含 boto3」）；
# local 路径仍绝不 import boto3（懒加载在 compose 的 _make_* 钩子里），与安装期是否装了 boto3 无关。
dependencies = [
    "gherkai-runtime[aws]",
]

[project.scripts]
# 安装后 `gherkai <子命令>`；开发期 `uv run gherkai …`（workspace 根）
gherkai = "gherkai_cli.__main__:main"

[tool.uv.sources]
gherkai-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gherkai_cli"]
