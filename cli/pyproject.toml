[project]
name = "cli"
version = "0.1.0"
description = "执行核心库的最薄前端 = 组合根：读 .feature、new 出具体 Engine adapter 注入给 core、渲染 RunResult（ADR 0016）"
readme = "README.md"
requires-python = ">=3.13"
# 依赖产品本体 gherkai（组合根共享层，它再依赖 core 窄腰）；引擎不在此声明——引擎是被 spawn 的
# 子进程，装配 cmd 的知识在 gherkai（ADR 0016「演进」节/0026）
dependencies = [
    "core",
    "gherkai",
]

# 云端后端（--backend cloud）走可选 extra（ADR 0016「cli backend 选择」）：cli 主依赖不含 boto3，
# `pip install cli[aws]` 才拉 core[aws]（= boto3）；纯 local 路径绝不 import boto3。
[project.optional-dependencies]
aws = ["gherkai[aws]"]

[project.scripts]
# 安装后可直接 `gherkai <feature>`；开发期用 `uv run python -m cli`
gherkai = "cli.__main__:main"

[tool.uv.sources]
gherkai = { path = "../gherkai", editable = true }
core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # cloud 接线层测试需 botocore 造真异常类型验退出码分层（ADR 0030 决定七）——只测接线不引 moto。
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
