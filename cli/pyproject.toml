[project]
name = "cli"
version = "0.1.0"
description = "执行核心库的最薄前端 = 组合根：读 .feature、new 出具体 Engine adapter 注入给 core、渲染 RunResult（ADR 0016）"
readme = "README.md"
requires-python = ">=3.13"
# 唯一依赖是 core（窄腰库）；引擎不在此声明——引擎是被 spawn 的子进程，cli 只持有起它们的 cmd（ADR 0016/0026）
dependencies = [
    "core",
]

[project.scripts]
# 安装后可直接 `yaozhou-run <feature>`；开发期用 `uv run python -m cli`
yaozhou-run = "cli.__main__:main"

[tool.uv.sources]
core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
