[project]
name = "gherkai-runtime"
version = "0.1.0"
description = "gherkai 产品本体 = 组合根共享层：引擎注册表/装配 + local 无状态跑批宿主 + 资源命名真源（ADR 0016「演进」节）。cli/Lambda/WebUI 都是它的入口皮。发行名 gherkai-runtime / import 名 gherkai_runtime（ADR 0037）"
readme = "README.md"
requires-python = ">=3.13"
# 依赖窄腰 core；引擎不在此声明——引擎是被 spawn 的子进程，本包只持有起它们的 cmd（ADR 0016/0026）。
# packaging：preflight 的版本 skew 比较（ADR 0037 决策 7），生产路径直接 import、直接声明。
dependencies = [
    "gherkai-core",
    "packaging>=24",
]

# 云端装配（build_cloud_stores/build_fargate_engines）走可选 extra：主依赖不含 boto3（ADR 0016/0030）。
[project.optional-dependencies]
aws = ["gherkai-core[aws]"]

[tool.uv.sources]
gherkai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gherkai_runtime"]
