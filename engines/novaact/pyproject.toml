[project]
name = "gherkai-worker-novaact"
dynamic = ["version"]
description = "gherkai 的 Nova Act 引擎 worker：由 gherkai 命令行拉起，在 AgentCore 云浏览器里执行 .feature 步骤"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhi Yan Liu" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
# worker 零 core 依赖（讲协议，ADR 0024/0037）；boto3 直接 import 就直接声明、不靠 nova-act 传递（ADR 0037 决策 2c）。
dependencies = [
    "nova-act==3.4.187.0",  # SDK 锁定精确版本，升级随发版评估（ADR 0042 决策六）
    "boto3>=1.34",
]

[project.scripts]
# 定位链第三级（PATH 可执行）由本包提供；第二级是同 venv 的 `python -m gherkai_worker_novaact`（ADR 0037 决策 3）
gherkai-worker-novaact = "gherkai_worker_novaact.__main__:main"

[project.urls]
Homepage = "https://github.com/zhiyanliu/gherkai"
Repository = "https://github.com/zhiyanliu/gherkai"
Changelog = "https://github.com/zhiyanliu/gherkai/blob/HEAD/CHANGELOG.md"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# 与 core/runtime/cli 同一份配置（ADR 0037 决策 2b）
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
strict = true
dirty = true
# metadata 不显式开（用 dunamai 默认「非 tag commit / 脏树才带 +local」）：显式 true 会让**干净 tag commit** 也算出
# `X.Y.Z+<sha>`，发布 gate（版本==tag）必败、PyPI 也拒收本地段——实际运行验过；ADR 0037 决策 2b。

[tool.hatch.build.targets.sdist]
exclude = ["DEVELOPMENT.md", "tests", "spikes"]  # contributor 文档、测试与 spike 不进发行包（ADR 0037 工程布局条；wheel 靠 packages 白名单本就不含，sdist 默认全收故要显式排）

[tool.hatch.build.targets.wheel]
packages = ["gherkai_worker_novaact"]
