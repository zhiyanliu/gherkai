[project]
name = "iac-aws-backend"
version = "0.1.0"
description = "iac_aws_backend：`--backend cloud` 需要的全部 AWS 资源 IaC（Python CDK）。见 ADR 0033。"
readme = "README.md"
requires-python = ">=3.10"
# CDK Python：aws-cdk-lib（v2 单包，含全部 L1/L2 construct）+ constructs（Construct 基类）。
# 纯合成/部署工具依赖，不与 core/cli/engines 共享 venv（各工程独立 uv venv）。
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app.py/stack.py/names.py 在项目根（非包）——把根加进 import path，使 tests 能 import stack/names（同 CDK app 布局）。
pythonpath = ["."]
