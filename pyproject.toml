[project]
name = "gherkai-workspace"
version = "0.0.0"
description = "uv workspace 根（不发行）：gherkai-core / gherkai-runtime / gherkai 三个发行包共用单 lock 与开发入口（ADR 0037）。根自身无发行物。"
requires-python = ">=3.13"
# 根只依赖 CLI 发行包（它再拉 runtime → core），使 `uv sync` 一次装齐三个成员（editable）。
dependencies = ["gherkai[local,deploy-aws]"]  # [local] = novaact worker；[deploy-aws] = AWS 供给包（ADR 0037 决策 3/6）

[tool.uv]
package = false  # 虚拟根：不构建、不安装自身

[tool.uv.workspace]
# 成员 = 目录 = 发行包（ADR 0037「工程布局」）。deploy_aws 与 engines/novaact 随后续阶段包化时加入。
members = ["core", "runtime", "cli", "engines/novaact", "deploy_aws"]  # engines/midscene 是 npm 包、不在此

[tool.uv.sources]
gherkai = { workspace = true }
gherkai-worker-novaact = { workspace = true }
gherkai-deploy-aws = { workspace = true }

[dependency-groups]
# 三个成员共用的开发依赖（moto 只装 dynamodb/s3 后端；pytest-timeout 是挂死安全网，见根 pytest 配置）。
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3",
    "boto3>=1.34",
    "moto[dynamodb,s3]>=5.0",
]

[tool.pytest.ini_options]
# 根跑全部成员的单测；各成员目录下 `uv run pytest` 也可（cwd 决定收集范围）。
testpaths = ["core/tests", "runtime/tests", "cli/tests", "engines/novaact/tests", "deploy_aws/tests"]
# 默认只跑单测（纯 moto/本地、绝不连真 AWS）——integration 标记默认 deselect；须显式 `-m integration` +
# 设 AWS_DDB_TABLE/AWS_S3_BUCKET（见 core/tests/README.md）。timeout=60 是挂死安全网：任何单测 >60s = 异常
# （尤其防 FargateEngine 等-STOPPED 轮询在忘换 moto ecs 时无限挂）。
addopts = "-m 'not integration' --timeout=60"
markers = [
    "integration: 连真 AWS（DDB/S3）的集成测试，默认不跑；须 -m integration + 设 AWS_DDB_TABLE/AWS_S3_BUCKET",
]
