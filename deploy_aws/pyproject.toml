[project]
name = "gherkai-deploy-aws"
# version 与依赖均动态（ADR 0037 决策 2b）：gherkai-runtime[aws] 同版本 lockstep。
dynamic = ["version", "dependencies"]
description = "gherkai 的 AWS 后端部署（gherkai deploy）：CDK 建 DynamoDB/S3/ECS/Lambda 等资源，worker 镜像推送与注册"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhi Yan Liu" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

[project.entry-points."gherkai.deploy"]
# provider 发现面（ADR 0037 决策 6）：CLI 按 entry point group 发现已安装的 provider 包；一个即无需 --provider。
aws = "gherkai_deploy_aws.cli:Provider"

[project.urls]
Homepage = "https://github.com/zhiyanliu/gherkai"
Repository = "https://github.com/zhiyanliu/gherkai"
Changelog = "https://github.com/zhiyanliu/gherkai/releases"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
# aws-cdk-lib 是 jsii 绑定（import 即起 node 子进程），只在本包上、经 CLI 的 [deploy-aws] extra 隔离（ADR 0037 决策 6）。
dependencies = [
    "gherkai-runtime[aws]=={{ version }}",
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
]

[tool.uv.sources]
gherkai-runtime = { workspace = true }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
strict = true
dirty = true
# metadata 不显式开（用 dunamai 默认「非 tag commit / 脏树才带 +local」）：显式 true 会让**干净 tag commit** 也算出
# `X.Y.Z+<sha>`，发布 gate（版本==tag）必败、PyPI 也拒收本地段——真跑验过；ADR 0037 决策 2b。

[tool.hatch.build.targets.sdist]
exclude = ["DEVELOPMENT.md"]  # contributor 文档不进发行包（wheel 本就不含；sdist 默认全收）

[tool.hatch.build.targets.wheel]
packages = ["gherkai_deploy_aws"]
