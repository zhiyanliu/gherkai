[project]
name = "gherkai"
version = "0.1.0"
description = "产品本体 = 组合根共享层：引擎注册表/装配 + local 无状态跑批宿主 + 资源命名真源（ADR 0016「演进」节）。cli/Lambda/WebUI 都是它的入口皮"
readme = "README.md"
requires-python = ">=3.13"
# 依赖窄腰 core；引擎不在此声明——引擎是被 spawn 的子进程，本包只持有起它们的 cmd（ADR 0016/0026）
dependencies = [
    "core",
]

# 云端装配（build_cloud_stores/build_fargate_engines）走可选 extra：主依赖不含 boto3（ADR 0016/0030）
[project.optional-dependencies]
aws = ["core[aws]"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # lambda handler / cloud 装配测试用 moto（对齐 core 的 dev 惯例，全程 mock 不连真 AWS）
    "boto3>=1.34",
    "moto[dynamodb,s3]>=5.0",
]

[tool.uv.sources]
core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gherkai"]
