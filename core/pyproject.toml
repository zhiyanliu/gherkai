[project]
name = "core"
version = "0.1.0"
description = "执行核心库（窄腰）：解析 .feature → 分组 scope → 调度 → 收集结果。零引擎依赖（ADR 0016）"
readme = "README.md"
requires-python = ">=3.13"
# 仅 Gherkin 解析依赖——核心不 import 任何引擎（ADR 0023/0024：引擎跑在 worker 子进程里）
# 下限 31.0.0：parse.py 用顶层导出 `from gherkin import Parser, Compiler`，该导出 ≥31.0.0 才有（ADR 0025）
dependencies = [
    "gherkin-official>=31.0.0",
]

# 云端 store adapter（DDB/S3）的依赖走 optional extra（方案 A，ADR 0030 决定六）：core 主依赖仍只 gherkin，
# `pip install core[aws]` 才拉 boto3；缺它时只有云端 adapter 用起来失败、core 主体可轻量 import（守窄腰）。
[project.optional-dependencies]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # 云端 adapter 单测用：boto3（也在 aws extra，此处显式列以保 `uv run pytest` 裸命令绿）+ moto 内存 mock
    # （只装 dynamodb/s3 后端，不拉全量 AWS 服务依赖）。全程 mock、绝不连真 AWS（见 tests/conftest.py 硬隔离）。
    "boto3>=1.34",
    "moto[dynamodb,s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑单测（纯 moto/本地、绝不连真 AWS）——integration 标记的用例默认 deselect。
# 连真 AWS 的集成测试须显式 `-m integration`（且设 AWS_DDB_TABLE/AWS_S3_BUCKET 环境变量，否则 skip）。见 tests/README.md。
addopts = "-m 'not integration'"
markers = [
    "integration: 连真 AWS（DDB/S3）的集成测试，默认不跑；须 -m integration + 设 AWS_DDB_TABLE/AWS_S3_BUCKET",
]
