[project]
name = "gherkai-core"
version = "0.1.0"
description = "gherkai 执行核心库（窄腰）：解析 .feature → 分组 scope → 调度 → 收集结果。零引擎依赖（ADR 0016）。发行名 gherkai-core / import 名 gherkai_core（ADR 0037）"
readme = "README.md"
requires-python = ">=3.13"
# 仅 Gherkin 解析依赖——核心不 import 任何引擎（ADR 0023/0024：引擎跑在 worker 子进程里）
# 下限 31.0.0：parse.py 用顶层导出 `from gherkin import Parser, Compiler`，该导出 ≥31.0.0 才有（ADR 0025）
dependencies = [
    "gherkin-official>=31.0.0",
]

# 云端 store adapter（DDB/S3）的依赖走 optional extra（ADR 0030 决定六）：core 主依赖仍只 gherkin，
# `gherkai-core[aws]` 才拉 boto3；缺它时只有云端 adapter 用起来失败、core 主体可轻量 import（守窄腰）。
# 库层保留此 extra 是给库消费者的；CLI 发行包 `gherkai` 已硬依赖 `gherkai-runtime[aws]`（ADR 0037 决策 2c）。
[project.optional-dependencies]
aws = ["boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gherkai_core"]
